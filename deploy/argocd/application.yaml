apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-cost-guard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ohanyere/kubernetes-cost-guard.git
    targetRevision: HEAD
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-cost-guard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
